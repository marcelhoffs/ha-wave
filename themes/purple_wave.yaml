# Purple wave theme for Home Assistant
# Place in /config/themes/purple_wave.yaml
# Requires in configuration.yaml:
#   frontend:
#     themes: !include_dir_merge_named themes

Purple wave:
  # ---- Typography ----
  primary-font-family: "Inter, 'Segoe UI', Roboto, system-ui, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-base_-_-webkit-font-smoothing: antialiased

  # ---- Shape ----
  ha-card-border-radius: "18px"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "24px"
  mdc-shape-small: "12px"
  mdc-shape-medium: "16px"
  ha-config-card-border-radius: "18px"

  # ---- Status colors ----
  success-color: "#10b981"
  warning-color: "#f59e0b"
  error-color: "#ef4444"
  info-color: "#3b82f6"

  modes:
    # ===================== LIGHT =====================
    light:
      # Accent (indigo / violet)
      primary-color: "#7c5cf6"
      rgb-primary-color: "124, 92, 246"
      accent-color: "#a855f7"
      rgb-accent-color: "168, 85, 247"
      mdc-theme-primary: "#7c5cf6"
      mdc-theme-secondary: "#a855f7"

      # Buttons & controls (Home Assistant primary scale, 40 = accent)
      ha-color-primary-05: "#140f28"
      ha-color-primary-10: "#211842"
      ha-color-primary-20: "#332666"
      ha-color-primary-30: "#5e46ba"
      ha-color-primary-40: "#7c5cf6"
      ha-color-primary-50: "#967df8"
      ha-color-primary-60: "#aa95f9"
      ha-color-primary-70: "#beaefa"
      ha-color-primary-80: "#d8cefc"
      ha-color-primary-90: "#ebe7fe"
      ha-color-primary-95: "#f6f4fe"
      ha-color-on-primary-loud: "#ffffff"
      ha-color-fill-disabled-quiet-resting: "#e7e4f3"
      ha-color-fill-disabled-quiet-hover: "#dbd8e8"
      ha-color-fill-disabled-normal-resting: "#e7e4f3"
      ha-color-fill-disabled-normal-hover: "#dbd8e8"
      ha-color-fill-disabled-loud-resting: "#c4c1d0"
      ha-color-fill-disabled-loud-hover: "#aca8b8"
      ha-color-on-disabled-quiet: "#c4c1d0"
      ha-color-on-disabled-normal: "#aca8b8"
      ha-color-on-disabled-loud: "#e7e4f3"

