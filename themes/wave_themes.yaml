      sidebar-menu-button-text-color: "#f2e9ec"

      # Icons & states
      state-icon-color: "#8b737b"
      state-active-color: "#e092ac"
      state-inactive-color: "#8b737b"

      # Per-domain state colors
      state-light-active-color: "#fbbf24"
      state-switch-active-color: "#e092ac"
      state-input_boolean-active-color: "#e092ac"
      state-fan-active-color: "#22d3ee"
