      ha-color-border-neutral-normal: "#463f5c"
      ha-color-border-neutral-loud: "#968db0"
      wa-color-neutral-fill-normal: "#2e2645"

      # Dialogs / popups
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.6)"
      ha-dialog-surface-background: "#1a1528"

Sapphire wave:
  # ---- Shape ----
  ha-card-border-radius: "18px"
  ha-card-border-width: "1px"
