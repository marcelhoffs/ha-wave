      # Sidebar
      sidebar-background-color: "#09111c"
      sidebar-text-color: "#c4d3e6"
      sidebar-icon-color: "#647993"
      sidebar-menu-button-text-color: "#e3ebf5"

      # Icons & states
      state-icon-color: "#647993"
      state-active-color: "#60a5fa"
      state-inactive-color: "#647993"

      # Per-domain state colors
      state-light-active-color: "#fbbf24"
      state-switch-active-color: "#60a5fa"
      state-input_boolean-active-color: "#60a5fa"
