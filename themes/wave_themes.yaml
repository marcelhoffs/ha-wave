      card-background-color: "#fefdff"
      ha-card-background: "#fefdff"
      ha-card-border-color: "rgba(76, 29, 149, 0.07)"
      ha-card-box-shadow: "0 1px 2px rgba(46,16,101,0.04), 0 8px 24px rgba(46,16,101,0.07)"
      divider-color: "rgba(76, 29, 149, 0.09)"

      # Text
      primary-text-color: "#1a1530"
      secondary-text-color: "#6b6385"
      disabled-text-color: "#d4cfe3"
      text-primary-color: "#ffffff"

      # Header
      app-header-background-color: "#f6f4fb"
      app-header-text-color: "#1a1530"
      app-header-border-bottom: "1px solid rgba(76,29,149,0.07)"
      app-header-selection-bar-color: "#7c5cf6"

      # Sidebar
      sidebar-background-color: "#fbfaff"
      sidebar-text-color: "#3d3557"
      sidebar-icon-color: "#a39bbd"
      sidebar-menu-button-text-color: "#1a1530"

      # Icons & states
      state-icon-color: "#a39bbd"
      state-active-color: "#7c5cf6"
      state-inactive-color: "#a39bbd"

      # Per-domain state colors
      state-light-active-color: "#f59e0b"
      state-switch-active-color: "#7c5cf6"
      state-input_boolean-active-color: "#7c5cf6"
      state-fan-active-color: "#06b6d4"
      state-media_player-active-color: "#d946ef"
      state-cover-active-color: "#8b5cf6"
      state-vacuum-active-color: "#14b8a6"
      state-automation-active-color: "#7c5cf6"
      state-binary_sensor-active-color: "#f43f5e"
      state-lock-locked-color: "#10b981"
      state-lock-unlocked-color: "#f43f5e"
      state-lock-jammed-color: "#ef4444"
      state-person-home-color: "#10b981"
      state-person-not_home-color: "#a39bbd"
      state-climate-heat-color: "#f97316"
      state-climate-cool-color: "#3b82f6"
      state-climate-auto-color: "#7c5cf6"
      state-climate-dry-color: "#eab308"
      state-climate-fan_only-color: "#06b6d4"
      state-alarm_control_panel-armed_away-color: "#10b981"
      state-alarm_control_panel-armed_home-color: "#10b981"
      state-alarm_control_panel-armed_night-color: "#6366f1"
      state-alarm_control_panel-disarmed-color: "#a39bbd"
      state-alarm_control_panel-triggered-color: "#ef4444"

      # Inputs
      input-fill-color: "#f3f0fa"
      ha-color-form-background: "#f3f0fa"
      ha-color-form-background-hover: "#eeeafa"
      ha-color-form-background-disabled: "#efecf7"
      ha-color-border-neutral-quiet: "rgba(76, 29, 149, 0.09)"
      ha-color-border-neutral-normal: "#d4cfe3"
      ha-color-border-neutral-loud: "#6b6385"
      wa-color-neutral-fill-normal: "#f4f0fe"

      # Dialogs / popups
      mdc-dialog-scrim-color: "rgba(26, 21, 48, 0.35)"
      ha-dialog-surface-background: "#fefdff"

