      card-background-color: "#062117"
      ha-card-background: "rgba(6, 33, 23, 0.85)"
      ha-card-border-color: "rgba(167, 243, 208, 0.08)"
      ha-card-box-shadow: "0 1px 0 rgba(167,243,208,0.04) inset, 0 8px 30px rgba(0,0,0,0.4)"
      divider-color: "rgba(167, 243, 208, 0.08)"

      # Text
      primary-text-color: "#def1ea"
      secondary-text-color: "#72a491"
      disabled-text-color: "#285243"
      text-primary-color: "#04110e"

      # Header
      app-header-background-color: "#04110e"
      app-header-text-color: "#def1ea"
      app-header-border-bottom: "1px solid rgba(167,243,208,0.06)"
      app-header-selection-bar-color: "#34d399"

      # Sidebar
      sidebar-background-color: "#031710"
      sidebar-text-color: "#baddd0"
      sidebar-icon-color: "#578775"
      sidebar-menu-button-text-color: "#def1ea"

      # Icons & states
      state-icon-color: "#578775"
      state-active-color: "#34d399"
      state-inactive-color: "#578775"

      # Per-domain state colors
      state-light-active-color: "#fbbf24"
      state-switch-active-color: "#34d399"
      state-input_boolean-active-color: "#34d399"
      state-fan-active-color: "#22d3ee"
      state-media_player-active-color: "#e879f9"
      state-cover-active-color: "#a7f3d0"
      state-vacuum-active-color: "#2dd4bf"
      state-automation-active-color: "#34d399"
      state-binary_sensor-active-color: "#fb7185"
      state-lock-locked-color: "#34d399"
      state-lock-unlocked-color: "#fb7185"
      state-lock-jammed-color: "#f87171"
      state-person-home-color: "#34d399"
      state-person-not_home-color: "#578775"
      state-climate-heat-color: "#fb923c"
      state-climate-cool-color: "#60a5fa"
      state-climate-auto-color: "#34d399"
      state-climate-dry-color: "#facc15"
      state-climate-fan_only-color: "#22d3ee"
      state-alarm_control_panel-armed_away-color: "#34d399"
      state-alarm_control_panel-armed_home-color: "#34d399"
      state-alarm_control_panel-armed_night-color: "#818cf8"
      state-alarm_control_panel-disarmed-color: "#578775"
      state-alarm_control_panel-triggered-color: "#f87171"

      # Inputs
      input-fill-color: "#082b1e"
