      # Icons & states
      state-icon-color: "#a38e95"
      state-active-color: "#7f1d3f"
      state-inactive-color: "#a38e95"

      # Per-domain state colors
      state-light-active-color: "#f59e0b"
      state-switch-active-color: "#7f1d3f"
      state-input_boolean-active-color: "#7f1d3f"
      state-fan-active-color: "#06b6d4"
