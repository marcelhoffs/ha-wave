      ha-color-form-background-hover: "#0b3525"
      ha-color-form-background-disabled: "#041b13"
      ha-color-border-neutral-quiet: "rgba(167, 243, 208, 0.08)"
      ha-color-border-neutral-normal: "#285243"
      ha-color-border-neutral-loud: "#72a491"
      wa-color-neutral-fill-normal: "#0c3a29"

      # Dialogs / popups
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.6)"
      ha-dialog-surface-background: "#062117"

