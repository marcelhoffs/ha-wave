# Purple wave: the hand-tuned source of every Wave theme.
# Edit this file, then run `python tools/generate.py` to rebuild themes/wave_themes.yaml.
# The generator adds the wave background (src/wave.svg) and Home Assistant's
# derived design tokens (buttons, form fields, disabled states), so they are not here.

Purple wave:
  # ---- Shape ----
  ha-card-border-radius: "18px"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "24px"
  mdc-shape-small: "12px"
  mdc-shape-medium: "16px"

  # ---- Status colors ----
  success-color: "#10b981"
  warning-color: "#f59e0b"
  error-color: "#ef4444"
  info-color: "#3b82f6"

  modes:
    # ===================== LIGHT =====================
    light:
      # Accent (indigo / violet)
      primary-color: "#7c5cf6"
      accent-color: "#a855f7"

      # Surfaces (lavender-tinted neutrals)
      primary-background-color: "#f6f4fb"
      secondary-background-color: "#efecf7"
      card-background-color: "#fefdff"
      ha-card-background: "#fefdff"
      ha-card-border-color: "rgba(76, 29, 149, 0.07)"
      ha-card-box-shadow: "0 1px 2px rgba(46,16,101,0.04), 0 8px 24px rgba(46,16,101,0.07)"
      divider-color: "rgba(76, 29, 149, 0.09)"

      # Text
      primary-text-color: "#1a1530"
      secondary-text-color: "#6b6385"
      disabled-text-color: "#d4cfe3"
      text-primary-color: "#ffffff"

      # Header
      app-header-background-color: "#f6f4fb"
      app-header-text-color: "#1a1530"
      app-header-border-bottom: "1px solid rgba(76,29,149,0.07)"
      app-header-selection-bar-color: "#7c5cf6"

      # Sidebar
      sidebar-background-color: "#fbfaff"
      sidebar-text-color: "#3d3557"
      sidebar-icon-color: "#a39bbd"
      sidebar-menu-button-text-color: "#1a1530"

      # Icons & states
      state-icon-color: "#a39bbd"
      state-active-color: "#7c5cf6"
      state-inactive-color: "#a39bbd"

      # Per-domain state colors
      state-light-active-color: "#f59e0b"
      state-switch-active-color: "#7c5cf6"
      state-input_boolean-active-color: "#7c5cf6"
      state-fan-active-color: "#06b6d4"
      state-media_player-active-color: "#d946ef"
      state-cover-active-color: "#8b5cf6"
      state-vacuum-active-color: "#14b8a6"
      state-automation-active-color: "#7c5cf6"
      state-binary_sensor-active-color: "#f43f5e"
      state-lock-locked-color: "#10b981"
      state-lock-unlocked-color: "#f43f5e"
      state-lock-jammed-color: "#ef4444"
      state-person-home-color: "#10b981"
      state-person-not_home-color: "#a39bbd"
      state-climate-heat-color: "#f97316"
      state-climate-cool-color: "#3b82f6"
      state-climate-auto-color: "#7c5cf6"
      state-climate-dry-color: "#eab308"
      state-climate-fan_only-color: "#06b6d4"
      state-alarm_control_panel-armed_away-color: "#10b981"
      state-alarm_control_panel-armed_home-color: "#10b981"
      state-alarm_control_panel-armed_night-color: "#6366f1"
      state-alarm_control_panel-disarmed-color: "#a39bbd"
      state-alarm_control_panel-triggered-color: "#ef4444"

      # Inputs
      input-fill-color: "#f3f0fa"

      # Dialogs / popups
      mdc-dialog-scrim-color: "rgba(26, 21, 48, 0.35)"
      ha-dialog-surface-background: "#fefdff"

    # ===================== DARK =====================
    dark:
      # Accent (soft violet)
      primary-color: "#a78bfa"
      accent-color: "#c084fc"

      # Surfaces (deep plum-tinted neutrals)
      primary-background-color: "#0e0b16"
      secondary-background-color: "#151121"
      card-background-color: "#1a1528"
      ha-card-background: "rgba(26, 21, 40, 0.85)"
      ha-card-border-color: "rgba(196, 181, 253, 0.08)"
      ha-card-box-shadow: "0 1px 0 rgba(196,181,253,0.04) inset, 0 8px 30px rgba(0,0,0,0.4)"
      divider-color: "rgba(196, 181, 253, 0.08)"

      # Text
      primary-text-color: "#ece8f5"
      secondary-text-color: "#968db0"
      disabled-text-color: "#463f5c"
      text-primary-color: "#0e0b16"

      # Header
      app-header-background-color: "#0e0b16"
      app-header-text-color: "#ece8f5"
      app-header-border-bottom: "1px solid rgba(196,181,253,0.06)"
      app-header-selection-bar-color: "#a78bfa"

      # Sidebar
      sidebar-background-color: "#120e1c"
      sidebar-text-color: "#d4cde6"
      sidebar-icon-color: "#7a7193"
      sidebar-menu-button-text-color: "#ece8f5"

      # Icons & states
      state-icon-color: "#7a7193"
      state-active-color: "#a78bfa"
      state-inactive-color: "#7a7193"

      # Per-domain state colors
      state-light-active-color: "#fbbf24"
      state-switch-active-color: "#a78bfa"
      state-input_boolean-active-color: "#a78bfa"
      state-fan-active-color: "#22d3ee"
      state-media_player-active-color: "#e879f9"
      state-cover-active-color: "#c4b5fd"
      state-vacuum-active-color: "#2dd4bf"
      state-automation-active-color: "#a78bfa"
      state-binary_sensor-active-color: "#fb7185"
      state-lock-locked-color: "#34d399"
      state-lock-unlocked-color: "#fb7185"
      state-lock-jammed-color: "#f87171"
      state-person-home-color: "#34d399"
      state-person-not_home-color: "#7a7193"
      state-climate-heat-color: "#fb923c"
      state-climate-cool-color: "#60a5fa"
      state-climate-auto-color: "#a78bfa"
      state-climate-dry-color: "#facc15"
      state-climate-fan_only-color: "#22d3ee"
      state-alarm_control_panel-armed_away-color: "#34d399"
      state-alarm_control_panel-armed_home-color: "#34d399"
      state-alarm_control_panel-armed_night-color: "#818cf8"
      state-alarm_control_panel-disarmed-color: "#7a7193"
      state-alarm_control_panel-triggered-color: "#f87171"

      # Inputs
      input-fill-color: "#211b33"

      # Dialogs / popups
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.6)"
      ha-dialog-surface-background: "#1a1528"
